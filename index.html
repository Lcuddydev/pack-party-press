<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack Party</title>
<meta name="description" content="Pack Party is the drawing party game where your friends play your cards. Wishlist it on Steam.">
<meta property="og:title" content="Pack Party">
<meta property="og:description" content="The drawing party game where your friends play your cards. Wishlist it on Steam.">
<meta property="og:image" content="https://playpackparty.com/img/social.jpg">
<meta property="og:url" content="https://playpackparty.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="preload" href="fonts/grandstander-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Grandstander'; font-weight: 800; font-display: swap; src: url('fonts/grandstander-latin-ext-800-normal.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20C0, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Grandstander'; font-weight: 800; font-display: swap; src: url('fonts/grandstander-latin-800-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Grandstander'; font-weight: 900; font-display: swap; src: url('fonts/grandstander-latin-ext-900-normal.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20C0, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Grandstander'; font-weight: 900; font-display: swap; src: url('fonts/grandstander-latin-900-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  --blue: #1975ee;
  --ink: #101653;
  --orange: #f97337;
  --white: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Grandstander', 'Trebuchet MS', sans-serif;
  font-weight: 800;
  color: var(--ink);
  background: var(--blue) url('img/swirl.svg') center / cover no-repeat;
  overflow-x: hidden;
}
a { color: inherit; }
a:focus-visible { outline: 4px solid var(--white); outline-offset: 5px; }

main {
  min-height: 100%;
  width: min(720px, 100% - 32px);
  margin: 0 auto;
  padding: 48px 0 40px;
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 26px;
  text-align: center;
}
.logo { display: block; width: min(460px, 84vw); height: auto; }
.tagline {
  margin: 0;
  color: var(--white);
  font-weight: 900;
  font-size: clamp(1.45rem, 4vw, 2.1rem);
  line-height: 1.2;
  max-width: 22ch;
  text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.25);
}
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
.button {
  display: inline-block;
  padding: 16px 30px 15px;
  font-weight: 900;
  font-size: 1.2rem;
  text-decoration: none;
  border-radius: 18px 24px 17px 26px / 22px 17px 25px 19px;
  transition: transform 0.12s ease;
}
.button:hover { transform: translate(-1px, -2px); }
.button:active { transform: translate(3px, 3px); }
.button.orange { background: var(--orange); color: var(--white); box-shadow: 0 0 0 4px var(--white), 8px 8px 0 rgba(0, 0, 0, 0.25); }
.button.white { background: var(--white); color: var(--ink); box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.25); }
.small {
  margin: 8px 0 0;
  color: var(--white);
  font-weight: 900;
  font-size: 1.1rem;
  line-height: 1.7;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.25);
}
.small a { text-decoration-thickness: 3px; text-underline-offset: 4px; }
@media (prefers-reduced-motion: reduce) { .button { transition: none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="img/logo.png" width="820" height="539" alt="Pack Party">
  <p class="tagline">The drawing party game where your friends play your cards.</p>
  <div class="actions">
    <a class="button orange" href="https://store.steampowered.com/app/5320720/">Wishlist on Steam</a>
    <a class="button white" href="https://github.com/Lcuddydev/pack-party-press/releases/latest/download/pack-party-press-kit.zip">Press kit</a>
  </div>
  <p class="small">
    Joining a game? Go to <a href="https://playpack.party">playpack.party</a><br>
    <a href="mailto:hello@playpackparty.com">hello@playpackparty.com</a>
  </p>
</main>
</body>
</html>
